{% extends "base.html" %}
{% load static %}

{% block title %}Sign Out - MenuMo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card shadow-sm">
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <span class="auth-icon">👋</span>
                        <h3 class="mt-2">Sign Out</h3>
                        <p class="text-muted">Are you sure you want to sign out?</p>
                    </div>

                    <form method="post" action="{% url 'account_logout' %}">
                        {% csrf_token %}
                        {% if redirect_field_value %}
                        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                        {% endif %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Sign Out</button>
                            <a href="{% url 'landing' %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
